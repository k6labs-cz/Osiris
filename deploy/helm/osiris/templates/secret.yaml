{{- /* Rendered once per template run, so Osiris and Anubis get the same generated client secret. */}}
{{- $clientSecret := include "osiris.clientSecret" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osiris.fullname" . }}
  labels:
    {{- include "osiris.labels" . | nindent 4 }}
type: Opaque
stringData:
  Auth__ClientSecret: {{ $clientSecret | quote }}
  Osiris__Model__ApiKey: {{ required "Set model.apiKey (the model's API key)." .Values.model.apiKey | quote }}
  {{- /* The key sealing the workspaces' secrets (base64, 32 bytes): generated once and kept. */}}
  Osiris__SecretKey: {{ include "osiris.keep" (dict "namespace" .Release.Namespace "secret" (include "osiris.fullname" .) "key" "Osiris__SecretKey" "fresh" (randAlphaNum 32 | b64enc)) | quote }}
  {{- with .Values.packagesToken }}
  OSIRIS_PACKAGES_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.anubis.enabled .Values.anubis.secrets.existingSecret }}
---
# The bundled Anubis's secrets (anubis.secrets.existingSecret): its admin password, generated once
# (the suffix satisfies the default password rules), and the osiris client's secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.anubis.secrets.existingSecret }}
  labels:
    {{- include "osiris.labels" . | nindent 4 }}
type: Opaque
stringData:
  Anubis__AdminPassword: {{ include "osiris.keep" (dict "namespace" .Release.Namespace "secret" .Values.anubis.secrets.existingSecret "key" "Anubis__AdminPassword" "fresh" (printf "%sAa1-" (randAlphaNum 24))) | quote }}
  {{- if not .Values.secrets.existingSecret }}
  Anubis__Clients__0__ClientSecret: {{ $clientSecret | quote }}
  {{- else }}
  Anubis__Clients__0__ClientSecret: {{ required "With secrets.existingSecret set auth.clientSecret too, so the bundled Anubis knows the osiris client's secret." .Values.auth.clientSecret | quote }}
  {{- end }}
{{- end }}
