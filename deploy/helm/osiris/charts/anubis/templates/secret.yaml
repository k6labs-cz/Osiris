{{- if not .Values.secrets.existingSecret }}
{{- $values := deepCopy (.Values.secrets.values | default dict) }}
{{- if and .Values.secrets.generateAdminPassword (not (hasKey $values "Anubis__AdminPassword")) }}
{{- /* Keep the password generated by an earlier install; the suffix satisfies the default password rules. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "anubis.fullname" .) }}
{{- $current := "" }}
{{- if $existing }}
{{- $current = index ($existing.data | default dict) "Anubis__AdminPassword" | default "" | b64dec }}
{{- end }}
{{- $_ := set $values "Anubis__AdminPassword" ($current | default (printf "%sAa1-" (randAlphaNum 24))) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anubis.fullname" . }}
  labels:
    {{- include "anubis.labels" . | nindent 4 }}
type: Opaque
{{- with $values }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
